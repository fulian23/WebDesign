<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>中国互联网大会 - 注册</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <div class="login">
        <div>
            {% for message in get_flashed_messages() %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        </div>
        <form action="/register" method="POST">
            {{ form.csrf_token() }}
            <div class="input-field">
                <input type="text" id="username" name="username" required>
                <label for="username">账号</label>
                <div class="underline"></div>
            </div>
            <div class="input-field">
                <input type="password" id="password" name="password" required>
                <label for="password">密码</label>
                <div class="underline"></div>
            </div>
            <button type="submit" class="button">注册</button>
        </form>
        <p class="register-link">已有账号？<a href="/login">返回登录</a></p>
    </div>
<!--网站输入效果开始-->
<script src="https://cdn.jsdelivr.net/gh/huangwb8/bloghelper@latest/js/input-with-fire.js "></script>
</body>
</html>
