        /* 全局样式 */

        }

        .logo img {

        }

        .header-title {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 导航样式 */
        nav {
            background-color: white;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .nav-container {
            display: flex;
            justify-content: center;
        }

        .nav-item {
            color: #333;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background-color: #e6f2ff;
            color: #0062cc;
        }

        .nav-item.active {
            background-color: #0062cc;
            color: white;
        }

        /* 主要内容样式 */
        .main-content {
            padding: 40px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 28px;
            color: #0062cc;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #0062cc, #0097ff);
        }

        .section-subtitle {
            font-size: 16px;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        /* 案例展示区域 */
        .case-showcase {
            margin-top: 40px;
        }

        .case-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .case-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .case-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .case-image {
            height: 200px;
            overflow: hidden;
        }

        .case-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .case-card:hover .case-image img {
            transform: scale(1.05);
        }

        .case-content {
            padding: 20px;
        }

        .case-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #0062cc;
        }

        .case-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .case-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .case-category {
            font-size: 12px;
            color: #0062cc;
            background-color: #e6f2ff;
            padding: 3px 10px;
            border-radius: 15px;
        }

        .case-view-more {
            color: #0062cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .case-view-more::after {
            content: '→';
            margin-left: 5px;
            transition: transform 0.3s ease;
        }

        .case-view-more:hover::after {
            transform: translateX(3px);
        }

        /* 分页导航 */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .page-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            border-radius: 50%;
            background-color: white;
            color: #0062cc;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: bold;
            cursor: pointer;
        }

        .page-item:hover {
            background-color: #0062cc;
            color: white;
        }

        .page-item.active {
            background-color: #0062cc;
            color: white;
        }

        footer {
            background-color: #0062cc;
            color: white;
            padding: 40px 0 20px;
            margin-top: 60px;
        }

            gap: 30px;
            margin-bottom: 30px;
        }

            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }

            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.5);

            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-bottom: 10px;
            transition: color 0.3s ease;

            color: white;
        }

            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

            width: 36px;
            height: 36px;

            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

            background-color: rgba(255, 255, 255, 0.2);
        }

            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .case-grid {
                grid-template-columns: 1fr;
            }

            .nav-container {
                flex-wrap: wrap;
            }

            .nav-item {
                padding: 10px 15px;
                margin: 5px;
            }

            .header-title {
                font-size: 24px;
            }

            .section-title {
                font-size: 24px;
            }
        }
    </style>

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            const caseGrid = document.getElementById('caseGrid');
            const pagination = document.getElementById('pagination');
            const itemsPerPage = 6;
            let currentPage = 1;

            // 加载案例内容
            function loadCases(page) {
                caseGrid.innerHTML = '';
                const startIndex = (page - 1) * itemsPerPage;
                const endIndex = Math.min(startIndex + itemsPerPage, caseData.length);

                for (let i = startIndex; i < endIndex; i++) {
                    const caseItem = caseData[i];
                    if (caseItem) {
                        const caseCard = document.createElement('div');
                        caseCard.className = 'case-card';

                        caseCard.innerHTML = `
                            <div class="case-image">
                                <img src="${caseItem.image}" alt="${caseItem.title}" />
                            </div>
                            <div class="case-content">
                                <h3 class="case-title">${caseItem.title}</h3>
                                <p class="case-description">${caseItem.description}</p>
                                <div class="case-footer">
                                    <span class="case-category">${caseItem.category}</span>
                                    <a href="${caseItem.link}" class="case-view-more" target="_blank">查看详情</a>
                                </div>
                            </div>
                        `;

                        caseGrid.appendChild(caseCard);
                    }
                }

                // 更新分页项状态
                const pageItems = pagination.querySelectorAll('.page-item');
                pageItems.forEach(item => {
                    if (parseInt(item.dataset.page) === page) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            // 初始化加载第1页
            loadCases(1);

            // 分页交互
            pagination.addEventListener('click', function(e) {
                if (e.target.classList.contains('page-item') && !e.target.classList.contains('active')) {
                    currentPage = parseInt(e.target.dataset.page);
                    loadCases(currentPage);
                }
            });

            // 导航栏交互
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    navItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
