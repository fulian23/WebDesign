<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="stylesheet" href="../static/css/dash_styles.css">
    <script src="../static/js/three.js"></script>
    <script src="https://unpkg.com/three-spritetext"></script>
</head>
<body>
    <div class="container">
        <!-- 3D背景 -->
        <canvas id="bg"></canvas>

        <!-- 主要内容 -->
        <main class="dashboard">
            <!-- 用户信息卡片 -->
            <section class="user-card" data-tilt>
                <div class="profile-image">
                    <div class="image-container">
                        <img src="{{ user_info.avatar or '/static/avatars/default.jpg' }}" alt="用户头像" id="current-avatar">
                        <div class="image-overlay">
                            <label for="avatar-upload" class="upload-btn">
                                <span class="btn-text">更换头像</span>
                                <input type="file" id="avatar-upload" accept="image/*" hidden>
                            </label>
                            <div class="upload-loader hidden">
                                <div class="spinner"></div>
                            </div>
                        </div>
                    </div>
                    <div class="profile-status">
                        <div class="status-ring"></div>
                    </div>
                </div>
                <div class="user-info">
                    <div class="username-container">
                        <h2 id="current-username">{{ user_info.username }}</h2>
                        <button class="edit-btn" id="edit-username">
                            <span class="btn-icon">✏️</span>
                        </button>
                    </div>
                    <div class="logout" style="float: left">
                        <button class="confirm-btn" onclick="window.location.href='/logout'">退出登录</button>
                    </div>
                </div>
            </section>

            <!-- 设置面板 -->
            <section class="settings-panel">
                <div class="panel-content">
                    <!-- 用户名修改 -->
                    <div class="setting-item username-edit hidden">
                        <div class="input-group">
                            <input type="hidden" name="old_username" value="{{ user_info.username }}">
                            <input type="text" id="username-input" placeholder="输入新用户名">
                            <div class="input-buttons">
                                <button class="confirm-btn" id="confirm-username">确认</button>
                                <button class="cancel-btn" id="cancel-username">取消</button>
                            </div>
                        </div>
                    </div>

                    <!-- 密码修改 -->
                    <div class="setting-item password-change">
                        <h3>修改密码</h3>
                        <div class="input-group">
                            <div class="password-field">
                                <input type="password" id="new-password" placeholder="输入新密码">
                                <button class="toggle-password">👁️</button>
                            </div>
                            <button class="change-btn" id="change-password">修改密码</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 悬浮操作按钮 -->
            <div class="floating-actions">
                <button class="action-btn" onclick="window.location.href='/index'">
                    <span class="btn-icon">🔙</span>
                    <span class="btn-label">返回主页</span>
                </button>
            </div>
        </main>
    </div>

    <!-- 通知系统 -->
    <div class="notification-container" id="notification-container"></div>

    <script src="../static/js/dash_script.js"></script>
    <script>
    document.getElementById('avatar-upload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const container = document.querySelector('.image-container');
    const loader = container.querySelector('.upload-loader');
    const imgElement = document.getElementById('current-avatar');

    try {
        loader.classList.remove('hidden');
        container.classList.add('uploading');
        showNotification("提交中...");
        const response = await fetch('/api/uploadAvatar', {
        method: 'POST',
        body: (() => {
            const formData = new FormData();
            formData.append('avatar', file);
            formData.append('username', document.getElementById('current-username').innerText);
            return formData;
            })(),
        credentials: 'include'
        });

        const result = await response.json();
        imgElement.src = result.avatar_url;
        showNotification('头像更新成功', 'success');

    } finally {
        loader.classList.add('hidden');
        container.classList.remove('uploading');
        e.target.value = '';
    }
});
    document.getElementById('confirm-username').addEventListener('click', async function() {
        showNotification("提交中...");
        const response = await fetch('/api/changeUsername', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
            old_username: '{{ user_info.username }}',
            new_username: document.getElementById('username-input').value
            }),
            credentials: 'include'
        });

        const data = await response.json();
        showNotification(data.message);
        document.getElementById('current-username').innerText = document.getElementById('username-input').value;

    });
    document.getElementById('change-password').addEventListener('click', async function() {
        showNotification("提交中...");
        const response = await fetch('/api/changePassword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
            username: document.getElementById('current-username').innerText,
            new_password: document.getElementById('new-password').value
            }),
            credentials: 'include'
        });

        const data = await response.json();
        showNotification(data.message);


    });
    </script>
</body>
</html>
