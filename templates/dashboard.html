<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户设置 - {{ user_info.username }}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 600px; margin-top: 50px; }
        .form-section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .username-label { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 当前用户展示 -->
        <div class="alert alert-info d-flex align-items-center">
        <!-- 添加头像展示 -->
        <img src="{{ user_info.avatar }}"
             class="rounded-circle me-3"
             style="width: 50px; height: 50px; object-fit: cover;"
             alt="用户头像"
             onerror="this.src='{{ url_for("static", filename="avatars/default.jpg") }}'">
        <div>
            <div>当前用户：<span class="username-label">{{ user_info.username }}</span></div>
        </div>
    </div>

        <!-- 消息提示区域 -->
        <div id="messageArea"></div>

        <!-- 上传头像 -->
        <div class="form-section">
            <h4>更换头像</h4>
            <form id="avatarForm" enctype="multipart/form-data">
                <input type="hidden" name="username" value="{{ user_info.username }}">
                <div class="mb-3">
                    <label class="form-label">选择头像</label>
                    <input type="file" class="form-control" name="avatar" accept="image/jpeg, image/png" required>
                </div>
                <button type="submit" class="btn btn-primary">上传头像</button>
            </form>
        </div>

        <!-- 修改用户名 -->
        <div class="form-section">
            <h4>修改用户名</h4>
            <form id="usernameForm">
                <input type="hidden" name="old_username" value="{{ user_info.username }}">
                <div class="mb-3">
                    <label class="form-label">新用户名</label>
                    <input type="text" class="form-control" name="new_username" required>
                </div>
                <button type="submit" class="btn btn-warning">修改用户名</button>
            </form>
        </div>

        <!-- 修改密码 -->
        <div class="form-section">
            <h4>修改密码</h4>
            <form id="passwordForm">
                <input type="hidden" name="username" value="{{ user_info.username }}">
                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <input type="password" class="form-control" name="new_password" required>
                </div>
                <button type="submit" class="btn btn-danger">修改密码</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
         // 增强版消息提示（支持自动消失）
    function showMessage(type, text, duration=3000) {
        const messageArea = document.getElementById('messageArea');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type} alert-dismissible fade show`;
        alert.setAttribute('role', 'alert');
        alert.innerHTML = `
            <div class="d-flex align-items-center">
                <svg class="bi flex-shrink-0 me-2" width="24" height="24" fill="${type === 'success' ? '#28a745' : '#dc3545'}">
                    ${type === 'success' ?
                    '<use xlink:href="#check-circle-fill"/>' :
                    '<use xlink:href="#exclamation-triangle-fill"/>'}
                </svg>
                <span>${text}</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;

        messageArea.prepend(alert);

        // 自动消失
        if (duration > 0) {
            setTimeout(() => {
                alert.remove();
            }, duration);
        }
    }

    // 操作按钮状态管理
    function setButtonState(button, isDisabled, text='') {
        button.disabled = isDisabled;
        if (text) button.innerHTML = text;
    }

    // SVG 图标定义（放在 body 最前面）
    document.body.insertAdjacentHTML('afterbegin', `
        <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <symbol id="check-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </symbol>
            <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </symbol>
        </svg>
    `);

        // 头像上传
        document.getElementById('avatarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const response = await fetch('/api/uploadAvatar', {
                    method: 'POST',
                    body: formData
                });

                if (response.redirected) {
                showMessage('success', '头像更新成功！页面即将刷新...', 1500);
                setTimeout(() => window.location.reload(), 1500);
            } else if (response.ok) {
                showMessage('success', '头像更新成功！', 3000);
            } else {
                const error = await response.json();
                showMessage('danger', `上传失败：${error.message}`);
            }
        } catch (error) {
            showMessage('danger', '网络错误：无法连接服务器');
        } finally {
            setButtonState(button, false, '上传头像');
        }
    });

        // 修改用户名
        document.getElementById('usernameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: e.target.old_username.value, // 从隐藏字段获取原用户名
                new_username: e.target.new_username.value
            };

            try {
                const response = await fetch('/api/changeUsername', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                     showMessage('success', '用户名修改成功！即将跳转登录...', 2000);
                setTimeout(() => {
                    window.location.href = '/logout'; // 需要重新登录
                }, 2000);
                } else {
                    const error = await response.json();
                    showMessage('danger', error.message);
                }
            } catch (error) {
                showMessage('danger', '请求失败');
            }
        });

        // 修改密码
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: e.target.username.value,
                new_password: e.target.new_password.value
            };

            try {
                const response = await fetch('/api/changePassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showMessage('success', '密码已更新！', 3000);
                    setTimeout(() => {
                    window.location.href = '/logout'; // 需要重新登录
                }, 2000);
                } else {
                    const error = await response.json();
                    showMessage('danger', error.message);
                }
            } catch (error) {
                showMessage('danger', '请求失败');
            }
        });
    </script>
</body>
</html>
