<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <nav class="text-white py-4" role="navigation" aria-label="主导航">
        <div class="container mx-auto flex justify-center items-center">
            <ul class="flex" role="menubar">
                <li role="none"><a href="#" class="hover:text-gray-200" role="menuitem">主页</a></li>
                <li role="none"><a href="#" class="hover:text-gray-200" role="menuitem">优秀案例</a></li>
                <li role="none"><a href="#" class="hover:text-gray-200" role="menuitem" aria-current="page">时间历程</a></li>
                <li role="none"><a href="#" class="hover:text-gray-200" role="menuitem">大会新闻</a></li>
                <li role="none"><a href="#" class="hover:text-gray-200" role="menuitem">用户</a></li>
            </ul>
        </div>
    </nav>
    <section class="text-center">
            <div class="title-section">
                <h2 id="timeline">成立历经时间</h2>
            </div>
        </section>
        <div class="timeline" role="list" aria-labelledby="timeline">
            <div class="timeline-item left" role="listitem">
                <span class="timeline-date">2002年5月18日</span>
                <div class="timeline-content">
                    <p>中国互联网大会首次创办，开启行业交流新篇章。</p>
                </div>
                <img src="https://picsum.photos/200/150" alt="2002年图片" loading="lazy" width="200" height="150">
            </div>
            <div class="timeline-item right" role="listitem">
                <span class="timeline-date">2005年6月20日</span>
                <div class="timeline-content">
                    <p>大会聚焦互联网创新应用，推动行业技术发展。</p>
                </div>
                <img src="https://picsum.photos/200/150" alt="2005年图片" loading="lazy" width="200" height="150">
            </div>
            <div class="timeline-item left" role="listitem">
                <span class="timeline-date">2010年7月22日</span>
                <div class="timeline-content">
                    <p>引入移动互联网相关议题，顺应行业发展趋势。</p>
                </div>
                <img src="https://picsum.photos/200/150" alt="2010年图片" loading="lazy" width="200" height="150">
            </div>
            <div class="timeline-item right" role="listitem">
                <span class="timeline-date">2015年8月25日</span>
                <div class="timeline-content">
                    <p>大会规模进一步扩大，吸引众多国际嘉宾参与。</p>
                </div>
                <img src="https://picsum.photos/200/150" alt="2015年图片" loading="lazy" width="200" height="150">
            </div>
            <div class="timeline-item left" role="listitem">
                <span class="timeline-date">2020年9月28日</span>
                <div class="timeline-content">
                    <p>增加线上会议形式，适应数字化发展需求。</p>
                </div>
                <img src="https://picsum.photos/200/150" alt="2020年图片" loading="lazy" width="200" height="150">
            </div>
            <div class="timeline-item right" role="listitem">
                <span class="timeline-date">2024年7月9日</span>
                <div class="timeline-content">
                    <p>以"会、展、赛、特色活动"为主线，聚焦多领域热点。</p>
                </div>
                <img src="https://picsum.photos/200/150" alt="2024年图片" loading="lazy" width="200" height="150">
            </div>
        </div>

</body>
</html>
